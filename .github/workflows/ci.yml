name: Android and uniqueness checks

on:
  push:
  pull_request:

jobs:
  unit-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile and run JVM unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Validate every bundled puzzle
        run: |
          # The repository offline validator uses the pure Kotlin code.
          # GitHub runner has kotlinc available; verify rather than silently skip.
          command -v kotlinc
          bash tools/offline/verify-catalog.sh
      - name: Prove 4x4 medium minimum and reverify emitted puzzle
        run: |
          bash tools/offline/minimize-catalog.sh app/src/main/assets/unique-puzzles.tsv 2 30000 > /tmp/hidato-optimized.tsv
          bash tools/offline/verify-catalog.sh /tmp/hidato-optimized.tsv
      - name: Run baseline minimum-clue benchmark (Issue #9 control)
        run: |
          bash tools/offline/benchmark-minimum-clues.sh \
            app/src/main/assets/unique-puzzles.tsv \
            tools/offline/minimum-clue-benchmark.tsv \
            /tmp/minimum-clue-benchmark-baseline-raw.csv \
            /tmp/minimum-clue-benchmark-baseline-summary.csv \
            30000 3 1000000 50000000 baseline
      - name: Run exact-distance propagation benchmark (Issue #9 variant)
        run: |
          bash tools/offline/benchmark-minimum-clues.sh \
            app/src/main/assets/unique-puzzles.tsv \
            tools/offline/minimum-clue-benchmark.tsv \
            /tmp/minimum-clue-benchmark-exact-raw.csv \
            /tmp/minimum-clue-benchmark-exact-summary.csv \
            30000 3 1000000 50000000 exact
      - name: Analyze fixed-path geometry and useful counterexamples (Issue #13)
        run: |
          bash tools/offline/analyze-fixed-path-geometry.sh \
            app/src/main/assets/unique-puzzles.tsv \
            tools/offline/fixed-path-geometry-corpus.tsv \
            /tmp/fixed-path-geometry-witnesses.csv \
            /tmp/fixed-path-geometry-summary.csv \
            /tmp/fixed-path-geometry-report.md \
            8 64 500000 500
      - name: Upload fixed-path geometry analysis
        uses: actions/upload-artifact@v4
        with:
          name: fixed-path-geometry-${{ github.run_id }}
          path: |
            /tmp/fixed-path-geometry-witnesses.csv
            /tmp/fixed-path-geometry-summary.csv
            /tmp/fixed-path-geometry-report.md
          if-no-files-found: error
          retention-days: 30
      - name: Benchmark geometry-guided local-window ordering (Issue #14 follow-up)
        run: |
          bash tools/offline/benchmark-fixed-path-window-order.sh \
            app/src/main/assets/unique-puzzles.tsv \
            tools/offline/fixed-path-geometry-corpus.tsv \
            /tmp/fixed-path-window-order-windows.csv \
            /tmp/fixed-path-window-order-summary.csv \
            /tmp/fixed-path-window-order-report.md \
            8 64
      - name: Upload fixed-path window-order benchmark
        uses: actions/upload-artifact@v4
        with:
          name: fixed-path-window-order-${{ github.run_id }}
          path: |
            /tmp/fixed-path-window-order-windows.csv
            /tmp/fixed-path-window-order-summary.csv
            /tmp/fixed-path-window-order-report.md
          if-no-files-found: error
          retention-days: 30
      - name: Upload reproducible benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: minimum-clue-benchmark-${{ github.run_id }}
          path: |
            /tmp/minimum-clue-benchmark-baseline-raw.csv
            /tmp/minimum-clue-benchmark-baseline-summary.csv
            /tmp/minimum-clue-benchmark-exact-raw.csv
            /tmp/minimum-clue-benchmark-exact-summary.csv
          if-no-files-found: error
          retention-days: 30
