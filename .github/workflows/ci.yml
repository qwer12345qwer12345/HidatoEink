name: Android and uniqueness checks

on:
  push:
  pull_request:

jobs:
  unit-and-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" 'platforms;android-34' 'build-tools;34.0.0'
      - name: Compile and run JVM unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Validate every bundled puzzle
        run: |
          # The repository offline validator uses the pure Kotlin code.
          # GitHub runner has kotlinc available; verify rather than silently skip.
          command -v kotlinc
          bash tools/offline/verify-catalog.sh
      - name: Prove 4x4 medium minimum and reverify emitted puzzle
        run: |
          bash tools/offline/minimize-catalog.sh app/src/main/assets/unique-puzzles.tsv 2 30000 > /tmp/hidato-optimized.tsv
          bash tools/offline/verify-catalog.sh /tmp/hidato-optimized.tsv
      - name: Run reproducible minimum-clue benchmark
        run: |
          bash tools/offline/benchmark-minimum-clues.sh \
            app/src/main/assets/unique-puzzles.tsv \
            tools/offline/minimum-clue-benchmark.tsv \
            /tmp/minimum-clue-benchmark-raw.csv \
            /tmp/minimum-clue-benchmark-summary.csv \
            30000 3 1000000 50000000
      - name: Upload reproducible benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: minimum-clue-benchmark-${{ github.run_id }}
          path: |
            /tmp/minimum-clue-benchmark-raw.csv
            /tmp/minimum-clue-benchmark-summary.csv
          if-no-files-found: error
          retention-days: 30
